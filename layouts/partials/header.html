<header class="header">
  <div class="header-left">
    <h1>{{ .Site.Params.name }}</h1>
    <h2>{{ .Site.Params.tagline }}</h2>
  </div>
  <div class="header-right">
    <ul class="icons">
      {{ with .Site.Params.github }}
      <li><a href="https://github.com/{{ . }}" target="_blank" rel="noopener" title="GitHub" class="icon-btn">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a></li>
      {{ end }}
      {{ with .Site.Params.linkedin }}
      <li><a href="https://www.linkedin.com/in/{{ . }}" target="_blank" rel="noopener" title="LinkedIn" class="icon-btn">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M0 1.15C0 .52.53 0 1.19 0h13.62C15.47 0 16 .52 16 1.15v13.7c0 .63-.53 1.15-1.19 1.15H1.19C.53 16 0 15.48 0 14.85V1.15zM4.75 13.4V6.17H2.4v7.23h2.35zM3.58 5.19c.82 0 1.33-.55 1.33-1.23-.01-.7-.51-1.23-1.31-1.23-.8 0-1.33.53-1.33 1.23 0 .68.51 1.23 1.3 1.23h.01zm3.02 8.21h2.35V9.37c0-.22.02-.44.08-.6.18-.44.58-.9 1.27-.9.9 0 1.26.68 1.26 1.68v3.85h2.35V9.27c0-2.17-1.16-3.18-2.7-3.18-1.25 0-1.8.7-2.11 1.18h.02V6.17H6.6c.03.66 0 7.23 0 7.23z"/></svg>
      </a></li>
      {{ end }}
    </ul>
    {{ with .Site.Params.email }}
    <p>Email: <a href="mailto:{{ . }}">{{ . }}</a></p>
    {{ end }}
    <p>Web: <a href="{{ .Site.BaseURL }}" target="_blank">{{ .Site.BaseURL }}</a></p>
  </div>
</header>
